version: 2

models:
  - name: stg_hotel_properties
    description: "Cleaned and typed hotel property records from Opera raw source. One row per property. Master reference data — no business logic applied. 50 properties across 4 brands and 8 countries."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: property_code
        description: "Unique property identifier in format BRAND-COUNTRY-001. System generated by Opera — never null."
        data_tests:
          - not_null
          - unique
      - name: property_name
        description: "Full display name of the property. Manually entered in Opera — may be null."
      - name: brand_code
        description: "Brand identifier — LUX, PRE, MID, ECO. System generated — never null."
        data_tests:
          - not_null
      - name: brand_name
        description: "Brand display name. Redundant with brand_code — nullable."
      - name: tier
        description: "Property tier classification — system configured on property setup."
        data_tests:
          - not_null
          - accepted_values:
              values: ["LUXURY", "PREMIUM", "MIDSCALE", "ECONOMY"]
      - name: star_rating
        description: "Star rating of the property — 2 to 5 stars. System configured — never null."
        data_tests:
          - not_null
          - accepted_values:
              values: [2, 3, 4, 5]
      - name: city
        description: "City where the property is located. Manually entered — may be null."
      - name: country_code
        description: "ISO country code — FR, UK, DE, ES, IT, NL, BE, AE. System configured — never null."
        data_tests:
          - not_null
      - name: local_currency
        description: "Local currency code — EUR, GBP, AED. System configured — never null."
        data_tests:
          - not_null
      - name: total_rooms
        description: "Total room count across all room types. System configured — never null."
        data_tests:
          - not_null
      - name: has_restaurant
        description: "True if property has an F&B outlet. Configuration flag — may be null."
      - name: has_parking
        description: "True if property has parking. Configuration flag — may be null."
      - name: has_spa
        description: "True if property has a spa. Configuration flag — may be null."
      - name: created_at
        description: "Date property was added to the system. May be null for legacy data."

  - name: stg_hotel_room_types
    description: "Cleaned and typed room type records per property. One row per room type per property. Reference data for RevPAR denominator calculations."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: room_type_id
        description: "Unique room type identifier — composite of property_code and room_type_code."
        data_tests:
          - not_null
          - unique
      - name: property_code
        description: "Parent property identifier. System generated — never null."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_properties')
              field: property_code
      - name: room_type_code
        description: "Opera room type code — STD, DBL, TWI, DLX-KNG etc."
        data_tests:
          - not_null
      - name: room_type_name
        description: "Display name of the room type e.g. Standard Room, Deluxe King."
      - name: is_accessible
        description: "True for accessible room types — DBCH and TWCH codes."
        data_tests:
          - not_null
      - name: total_rooms
        description: "Total number of rooms of this type in this property."
        data_tests:
          - not_null
      - name: max_occupancy
        description: "Maximum number of guests permitted in this room type."
        data_tests:
          - not_null
      - name: created_at
        description: "Date room type was added to the system."

  - name: stg_guests
    description: "Cleaned guest profile records from Opera. One row per guest regardless of loyalty status. Contains PII fields — masked for non-prod roles in Phase 5."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: guest_profile_id
        description: "Unique guest profile identifier. System generated by Opera — never null."
        data_tests:
          - not_null
          - unique
      - name: guest_title
        description: "Guest salutation — Mr, Mrs, Ms, Dr, Prof. Manually entered — may be null."
      - name: guest_first_name
        description: "Guest first name. PII — masked in non-prod roles."
        data_tests:
          - not_null
      - name: guest_last_name
        description: "Guest last name. PII — masked in non-prod roles."
        data_tests:
          - not_null
      - name: guest_email
        description: "Guest email. PII — masked in non-prod roles. May be null or dummy for OTA bookings."
      - name: guest_phone
        description: "Guest phone number. PII — may be null for OTA bookings."
      - name: guest_address
        description: "Guest address. PII — may be null for OTA bookings."
      - name: nationality_code
        description: "ISO 3-letter nationality code e.g. GBR, FRA, DEU."
      - name: is_avenir_member
        description: "True if guest is enrolled in AVENIR Rewards programme."
        data_tests:
          - not_null
      - name: has_invalid_name
        description: "Ground truth flag — M1 fake or joke name injected deliberately."
        data_tests:
          - not_null
      - name: has_garbled_name
        description: "Ground truth flag — M2 transliteration artifact from OTA booking."
        data_tests:
          - not_null
      - name: has_invalid_email
        description: "Ground truth flag — M3 dummy or missing email from OTA booking."
        data_tests:
          - not_null
      - name: has_missing_phone
        description: "Ground truth flag — M4 missing phone number from OTA booking."
        data_tests:
          - not_null
      - name: has_missing_address
        description: "Ground truth flag — M5 missing address from OTA booking."
        data_tests:
          - not_null
      - name: created_at
        description: "Date guest profile was created in Opera."

  - name: stg_avenir_members
    description: "Cleaned AVENIR Rewards membership records. One row per member. Subset of guests enrolled in the loyalty programme."
    meta:
      owner: sachin
      domain: loyalty
    columns:
      - name: member_number
        description: "Unique AVENIR member number in format ALL-0000000001. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: guest_profile_id
        description: "Parent guest profile identifier. Links to stg_guests."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_guests')
              field: guest_profile_id
      - name: current_tier
        description: "Current loyalty tier — CLASSIC, SILVER, GOLD, PLATINUM, DIAMOND."
        data_tests:
          - not_null
          - accepted_values:
              values: ["CLASSIC", "SILVER", "GOLD", "PLATINUM", "DIAMOND"]
      - name: join_date
        description: "Date member enrolled in AVENIR programme."
        data_tests:
          - not_null
      - name: lifetime_nights
        description: "Total qualifying nights since joining — determines tier eligibility."
        data_tests:
          - not_null
      - name: lifetime_status_points
        description: "Total status points ever earned — used for tier qualification."
        data_tests:
          - not_null
      - name: current_reward_points
        description: "Current redeemable reward points balance."
        data_tests:
          - not_null
      - name: created_at
        description: "Date membership record was created."

  - name: stg_hotel_reservations
    description: "Cleaned reservation records from Opera. One row per booking. Core operational entity — all other tables link back to this."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: confirmation_number
        description: "Unique 9-digit Opera confirmation number. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: property_code
        description: "Property where reservation is held. System generated — never null."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_properties')
              field: property_code
      - name: guest_profile_id
        description: "Guest making the reservation. System generated — never null."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_guests')
              field: guest_profile_id
      - name: room_type_id
        description: "Room type booked. System generated — never null."
        data_tests:
          - not_null
      - name: room_type_booked
        description: "Room type code at time of booking."
        data_tests:
          - not_null
      - name: room_type_to_charge
        description: "Room type code for billing — same as booked unless upgraded."
        data_tests:
          - not_null
      - name: was_upgraded
        description: "True when room_type_booked differs from room_type_to_charge."
        data_tests:
          - not_null
      - name: room_number
        description: "Physical room number assigned at check-in. May be null before arrival."
      - name: rate_code
        description: "Opera rate code — FLRA3, RA1, ARA1 etc."
        data_tests:
          - not_null
      - name: rate_channel
        description: "Derived booking channel — DIRECT, OTA_PRIMARY, OTA_SECONDARY, AVENIR_MEMBER etc."
        data_tests:
          - not_null
      - name: rate_flexibility
        description: "Derived flexibility tier — FLEXIBLE, SEMI_FLEX, SAVER, ADVANCE_SAVER."
        data_tests:
          - not_null
      - name: includes_breakfast
        description: "True for RB rate codes — breakfast included in rate."
        data_tests:
          - not_null
      - name: market_segment
        description: "Derived market segment — LEISURE, LOYALTY, CORPORATE, GROUP, MICE."
        data_tests:
          - not_null
          - accepted_values:
              values: ["LEISURE", "LOYALTY", "CORPORATE", "GROUP", "MICE"]
      - name: booking_date
        description: "Date reservation was made. System generated — never null."
        data_tests:
          - not_null
      - name: check_in_date
        description: "Arrival date. System generated — never null."
        data_tests:
          - not_null
      - name: check_out_date
        description: "Departure date. System generated — never null."
        data_tests:
          - not_null
      - name: nights
        description: "Length of stay in nights."
        data_tests:
          - not_null
      - name: adults
        description: "Number of adults in reservation."
        data_tests:
          - not_null
      - name: children
        description: "Number of children in reservation."
        data_tests:
          - not_null
      - name: booking_status
        description: "Current reservation status."
        data_tests:
          - not_null
          - accepted_values:
              values: ["CONFIRMED", "CHECKED_IN", "CHECKED_OUT", "CANCELLED", "NO_SHOW"]
      - name: nightly_rate
        description: "Rate per night in local currency."
        data_tests:
          - not_null
      - name: total_cost
        description: "Total cost of stay in local currency."
        data_tests:
          - not_null
      - name: local_currency
        description: "Currency code — EUR, GBP, AED."
        data_tests:
          - not_null
      - name: travel_agent
        description: "OTA name — Booking.com, Expedia, blank for direct bookings."
      - name: tars_external_ref
        description: "TARS reference number — filled for OTA bookings, blank for direct."
      - name: gds_record_locator
        description: "8-character GDS locator — filled for corporate and group bookings."
      - name: is_direct_booking
        description: "True when travel_agent is blank — derived field."
        data_tests:
          - not_null
      - name: member_number
        description: "AVENIR member number if guest is a member — null for non-members."
      - name: actual_checkin_at
        description: "Actual check-in timestamp — filled at check-in, null before arrival."
      - name: is_duplicate_reservation
        description: "Ground truth flag — M6 duplicate reservation injected deliberately."
        data_tests:
          - not_null
      - name: is_test_record
        description: "Ground truth flag — M7 test or system record injected deliberately."
        data_tests:
          - not_null
      - name: has_invalid_date_sequence
        description: "Ground truth flag — M8 check_out before check_in injected deliberately."
        data_tests:
          - not_null

  - name: stg_hotel_folios
    description: "Cleaned folio charge records per reservation. One row per charge. Multiple windows possible — ROOM, FB, OTHER. Source for TRevPAR calculations."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: folio_id
        description: "Unique folio charge identifier. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: confirmation_number
        description: "Parent reservation identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_reservations')
              field: confirmation_number
      - name: window_number
        description: "Billing window number — 1 Room, 2 FB, 3 Other."
        data_tests:
          - not_null
      - name: charge_type
        description: "Category of charge — ROOM, FB, OTHER."
        data_tests:
          - not_null
          - accepted_values:
              values: ["ROOM", "FB", "OTHER"]
      - name: charge_description
        description: "Description of charge — Room Charge, Breakfast, Parking etc."
        data_tests:
          - not_null
      - name: amount_local
        description: "Charge amount in local currency."
        data_tests:
          - not_null
      - name: currency_code
        description: "Currency of charge — EUR, GBP, AED."
        data_tests:
          - not_null
      - name: amount_eur
        description: "Charge amount converted to EUR."
        data_tests:
          - not_null
      - name: payment_method
        description: "Payment method — MasterCard, Visa, Amex, Cash, BankTransfer."
        data_tests:
          - not_null
      - name: card_last4
        description: "Last 4 digits of card. Null for Cash and BankTransfer."
      - name: payee
        description: "Who pays — Guest, Bookingcom Agent, Expedia Collect etc."
        data_tests:
          - not_null
      - name: charge_date
        description: "Date charge was posted."
        data_tests:
          - not_null

  - name: stg_hotel_cancellations
    description: "Cleaned cancellation records. One row per cancellation. Covers guest-initiated, hotel-initiated, no-show, and duplicate cancellations."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: cancellation_id
        description: "Unique cancellation identifier. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: confirmation_number
        description: "Parent reservation identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_reservations')
              field: confirmation_number
      - name: cancellation_date
        description: "Date cancellation was processed."
        data_tests:
          - not_null
      - name: reason_code
        description: "Opera cancellation reason code — SDX, DUP, PLN, WEA etc."
        data_tests:
          - not_null
      - name: reason_group
        description: "Grouped reason — GUEST_INITIATED, HOTEL_INITIATED, NO_SHOW, DUPLICATE, GROUP, SYSTEM."
        data_tests:
          - not_null
          - accepted_values:
              values: ["GUEST_INITIATED", "HOTEL_INITIATED", "NO_SHOW", "DUPLICATE", "GROUP", "SYSTEM"]
      - name: days_before_checkin
        description: "Days between cancellation date and original check-in date."
        data_tests:
          - not_null
      - name: cancellation_window
        description: "Cancellation timing bucket — SAME_DAY, LAST_MINUTE, SHORT, MEDIUM, ADVANCE."
        data_tests:
          - not_null
          - accepted_values:
              values: ["SAME_DAY", "LAST_MINUTE", "SHORT", "MEDIUM", "ADVANCE"]
      - name: revenue_at_risk
        description: "Total cost of cancelled reservation in local currency."
        data_tests:
          - not_null
      - name: currency_code
        description: "Currency of revenue at risk."
        data_tests:
          - not_null

  - name: stg_ops_room_availability
    description: "Cleaned daily room availability records. One row per property per room type per date. OOO rooms excluded from available count. RevPAR denominator source."
    meta:
      owner: sachin
      domain: operations
    columns:
      - name: availability_id
        description: "Unique availability record identifier. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: property_code
        description: "Property identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_properties')
              field: property_code
      - name: room_type_id
        description: "Room type identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_room_types')
              field: room_type_id
      - name: stay_date
        description: "Calendar date for this availability record."
        data_tests:
          - not_null
      - name: total_rooms
        description: "Total rooms of this type in this property."
        data_tests:
          - not_null
      - name: ooo_rooms
        description: "Rooms out of order — not sellable. Excluded from available count."
        data_tests:
          - not_null
      - name: rooms_available
        description: "Available rooms — total_rooms minus ooo_rooms. RevPAR denominator."
        data_tests:
          - not_null

  - name: stg_avenir_points_transactions
    description: "Cleaned loyalty points transaction records. One row per transaction. Status points and reward points tracked separately."
    meta:
      owner: sachin
      domain: loyalty
    columns:
      - name: transaction_id
        description: "Unique transaction identifier. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: member_number
        description: "AVENIR member who earned the points."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_avenir_members')
              field: member_number
      - name: confirmation_number
        description: "Source reservation for this points transaction."
        data_tests:
          - not_null
      - name: transaction_type
        description: "Type of earning activity — STAY, DINING, PARTNER, SHOPPING."
        data_tests:
          - not_null
          - accepted_values:
              values: ["STAY", "DINING", "PARTNER", "SHOPPING"]
      - name: transaction_date
        description: "Date points were posted to member account."
        data_tests:
          - not_null
      - name: status_points
        description: "Status points earned — used for tier qualification."
        data_tests:
          - not_null
      - name: reward_points
        description: "Reward points earned — used for redemption."
        data_tests:
          - not_null
      - name: tier_at_earn
        description: "Member tier at time of earning — affects points multiplier."
        data_tests:
          - not_null
      - name: property_code
        description: "Property where points were earned."
        data_tests:
          - not_null
      - name: has_early_points
        description: "Ground truth flag — M9 points earned before checkout date."
        data_tests:
          - not_null

  - name: stg_avenir_tier_history
    description: "Cleaned loyalty tier change history. One row per tier change event per member. Tracks upgrades, downgrades, and new member events over 3 years."
    meta:
      owner: sachin
      domain: loyalty
    columns:
      - name: history_id
        description: "Unique tier history record identifier. System generated — never null."
        data_tests:
          - not_null
          - unique
      - name: member_number
        description: "AVENIR member whose tier changed."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_avenir_members')
              field: member_number
      - name: previous_tier
        description: "Previous tier before change. Null for NEW_MEMBER events."
      - name: new_tier
        description: "New tier after change."
        data_tests:
          - not_null
          - accepted_values:
              values: ["CLASSIC", "SILVER", "GOLD", "PLATINUM", "DIAMOND"]
      - name: change_type
        description: "Type of tier change — NEW_MEMBER, UPGRADE, DOWNGRADE, RETAINED."
        data_tests:
          - not_null
          - accepted_values:
              values: ["NEW_MEMBER", "UPGRADE", "DOWNGRADE", "RETAINED"]
      - name: effective_date
        description: "Date tier change took effect."
        data_tests:
          - not_null
      - name: status_points_at_change
        description: "Status points balance at time of tier change."
        data_tests:
          - not_null
