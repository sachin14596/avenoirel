version: 2

models:
  - name: stg_hotel_properties
    description: "Cleaned and typed hotel property records from Opera raw source. One row per property. Master reference data — no business logic applied. 50 properties across 4 brands and 8 countries."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: property_code
        description: "Unique property identifier in format BRAND-COUNTRY-001. System generated by Opera — never null."
        data_tests:
          - not_null
          - unique

      - name: property_name
        description: "Full display name of the property e.g. Lumiere Hotels Paris. Manually entered in Opera — may be null in legacy migration data."

      - name: brand_code
        description: "Brand identifier — LUX, PRE, MID, ECO. System generated — links to brands seed table."
        data_tests:
          - not_null

      - name: brand_name
        description: "Brand display name e.g. Lumiere Hotels. Redundant with brand_code — nullable."

      - name: tier
        description: "Property tier classification — system configured on property setup."
        data_tests:
          - not_null
          - accepted_values:
              values: ['LUXURY', 'PREMIUM', 'MIDSCALE', 'ECONOMY']

      - name: star_rating
        description: "Star rating of the property — 2 to 5 stars. System configured — never null."
        data_tests:
          - not_null
          - accepted_values:
              values: [2, 3, 4, 5]

      - name: city
        description: "City where the property is located. Manually entered in Opera — may be null."

      - name: country_code
        description: "ISO country code — FR, UK, DE, ES, IT, NL, BE, AE. System configured — never null."
        data_tests:
          - not_null

      - name: local_currency
        description: "Local currency code — EUR, GBP, AED. System configured based on country — never null."
        data_tests:
          - not_null

      - name: total_rooms
        description: "Total room count across all room types in this property. System configured — never null."
        data_tests:
          - not_null

      - name: has_restaurant
        description: "True if property has an F&B outlet. Configuration flag — may be null for newly onboarded properties."

      - name: has_parking
        description: "True if property has parking facilities. Configuration flag — may be null for newly onboarded properties."

      - name: has_spa
        description: "True if property has a spa. Configuration flag — may be null for newly onboarded properties."

      - name: created_at
        description: "Date property was added to the system. May be null for legacy data migrated from older systems."