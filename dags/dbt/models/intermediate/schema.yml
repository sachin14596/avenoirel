version: 2

models:
  - name: int_revenue_by_property_daily
    description: "Daily revenue, occupancy, and RevPAR metrics per property per room type. Joins room availability with reservations and folios. Foundation for all revenue KPI calculations in marts layer."
    meta:
      owner: sachin
      domain: revenue
    columns:
      - name: property_code
        description: "Property identifier. Foreign key to stg_hotel_properties."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_properties')
              field: property_code
      - name: room_type_id
        description: "Room type identifier. Foreign key to stg_hotel_room_types."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hotel_room_types')
              field: room_type_id
      - name: stay_date
        description: "Calendar date for this availability and revenue record."
        data_tests:
          - not_null
      - name: total_rooms
        description: "Total physical rooms of this type in this property."
        data_tests:
          - not_null
      - name: ooo_rooms
        description: "Rooms out of order — not sellable on this date."
        data_tests:
          - not_null
      - name: rooms_available
        description: "Rooms available to sell — total_rooms minus ooo_rooms. RevPAR denominator."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              severity: warn
      - name: rooms_sold
        description: "Rooms occupied on this date — CHECKED_IN, CHECKED_OUT, NO_SHOW statuses."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: room_revenue_eur
        description: "Total room charge revenue in EUR for this date."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: avg_daily_rate_eur
        description: "Average Daily Rate — room_revenue_eur divided by rooms_sold. Null when rooms_sold is zero."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "avg_daily_rate_eur is not null"
      - name: occupancy_rate
        description: "Occupancy rate — rooms_sold divided by rooms_available. Between 0 and 1."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 and occupancy_rate <= 1"
              where: "occupancy_rate is not null"
              severity: warn
      - name: revpar_eur
        description: "Revenue Per Available Room — room_revenue_eur divided by rooms_available."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "revpar_eur is not null"
              severity: warn

  - name: int_booking_cancellation_signals
    description: "Cancellation records enriched with original booking details. One row per cancellation. Source for cancellation pattern analysis."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: cancellation_id
        description: "Unique cancellation identifier."
        data_tests:
          - not_null
          - unique
      - name: confirmation_number
        description: "Parent reservation identifier."
        data_tests:
          - not_null
      - name: property_code
        description: "Property where booking was made."
        data_tests:
          - not_null
      - name: booking_date
        description: "Date original reservation was made."
        data_tests:
          - not_null
      - name: check_in_date
        description: "Original arrival date."
        data_tests:
          - not_null
      - name: cancellation_date
        description: "Date cancellation was processed."
        data_tests:
          - not_null
      - name: days_before_checkin
        description: "Days between cancellation and original check-in."
        data_tests:
          - not_null
      - name: cancellation_window
        description: "Timing bucket — SAME_DAY, LAST_MINUTE, SHORT, MEDIUM, ADVANCE."
        data_tests:
          - not_null
      - name: reason_code
        description: "Opera cancellation reason code."
        data_tests:
          - not_null
      - name: reason_group
        description: "Grouped reason — GUEST_INITIATED, HOTEL_INITIATED, NO_SHOW, DUPLICATE, GROUP, SYSTEM."
        data_tests:
          - not_null
      - name: rate_channel
        description: "Booking channel — DIRECT, OTA_PRIMARY etc."
        data_tests:
          - not_null
      - name: market_segment
        description: "Market segment — LEISURE, LOYALTY, CORPORATE etc."
        data_tests:
          - not_null
      - name: is_direct_booking
        description: "True when booking was made directly."
        data_tests:
          - not_null
      - name: revenue_at_risk
        description: "Total cost of cancelled reservation in local currency."
        data_tests:
          - not_null
      - name: local_currency
        description: "Currency of revenue at risk."
        data_tests:
          - not_null
      - name: is_last_minute
        description: "Yes when days_before_checkin <= 3. High-impact cancellation flag."
        data_tests:
          - not_null
          - accepted_values:
              values: ["Yes", "No"]

  - name: int_loyalty_tier_movement
    description: "Tier change history enriched with window functions. One row per tier change event. Includes previous change date, next tier, days spent at each tier, and latest record flag."
    meta:
      owner: sachin
      domain: loyalty
    columns:
      - name: history_id
        description: "Unique tier history record identifier."
        data_tests:
          - not_null
          - unique
      - name: member_number
        description: "AVENIR member identifier."
        data_tests:
          - not_null
      - name: previous_tier
        description: "Tier before this change. Null for NEW_MEMBER events."
      - name: new_tier
        description: "Tier after this change."
        data_tests:
          - not_null
      - name: change_type
        description: "Type of tier change — NEW_MEMBER, UPGRADE, DOWNGRADE, RETAINED."
        data_tests:
          - not_null
      - name: effective_date
        description: "Date tier change took effect."
        data_tests:
          - not_null
      - name: status_points_at_change
        description: "Status points balance at time of change."
        data_tests:
          - not_null
      - name: prev_change_date
        description: "Date of previous tier change for this member. Null for first record."
      - name: next_tier
        description: "Next tier this member moved to. Null for latest record."
      - name: days_at_tier
        description: "Days spent at previous tier before this change. Null for first record."
      - name: is_latest_record
        description: "True for the most recent tier record per member."
        data_tests:
          - not_null

  - name: int_loyalty_points_validated
    description: "Points transactions validated against checkout dates. Flags M9 early points messiness. Invalid transactions retained but flagged — marts layer filters on is_valid_transaction."
    meta:
      owner: sachin
      domain: loyalty
    columns:
      - name: transaction_id
        description: "Unique transaction identifier."
        data_tests:
          - not_null
          - unique
      - name: member_number
        description: "AVENIR member who earned points."
        data_tests:
          - not_null
      - name: confirmation_number
        description: "Source reservation. Null for non-stay transactions."
      - name: transaction_type
        description: "Earning activity — STAY, DINING, PARTNER, SHOPPING."
        data_tests:
          - not_null
      - name: transaction_date
        description: "Date points were posted."
        data_tests:
          - not_null
      - name: status_points
        description: "Status points earned."
        data_tests:
          - not_null
      - name: reward_points
        description: "Reward points earned."
        data_tests:
          - not_null
      - name: tier_at_earn
        description: "Member tier at time of earning."
        data_tests:
          - not_null
      - name: property_code
        description: "Property where points were earned."
        data_tests:
          - not_null
      - name: check_out_date
        description: "Checkout date from reservation. Null for non-stay transactions."
      - name: has_early_points
        description: "Ground truth flag — M9 early points injected deliberately."
        data_tests:
          - not_null
      - name: is_valid_transaction
        description: "True when transaction_date >= check_out_date. False for M9 violations."
        data_tests:
          - not_null

  - name: int_stay_duration_metrics
    description: "Reservation records enriched with stay duration metrics and window function analytics. One row per reservation. Source for ALOS, lead time, and guest lifetime value analysis."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: confirmation_number
        description: "Unique reservation identifier."
        data_tests:
          - not_null
          - unique
      - name: property_code
        description: "Property where reservation is held."
        data_tests:
          - not_null
      - name: guest_profile_id
        description: "Guest making the reservation."
        data_tests:
          - not_null
      - name: booking_date
        description: "Date reservation was made."
        data_tests:
          - not_null
      - name: check_in_date
        description: "Arrival date."
        data_tests:
          - not_null
      - name: check_out_date
        description: "Departure date."
        data_tests:
          - not_null
      - name: nights
        description: "Length of stay in nights."
        data_tests:
          - not_null
      - name: booking_status
        description: "Current reservation status."
        data_tests:
          - not_null
      - name: total_cost
        description: "Total cost of stay in local currency."
        data_tests:
          - not_null
      - name: local_currency
        description: "Currency of this booking."
        data_tests:
          - not_null
      - name: lead_time_days
        description: "Days between booking date and check-in date. Advance booking indicator."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: brand_code
        description: "Brand code from properties — LUX, PRE, MID, ECO."
        data_tests:
          - not_null
      - name: avg_los_by_brand
        description: "Average length of stay across all reservations for this brand. Window function — AVG() OVER PARTITION BY brand_code."
        data_tests:
          - not_null
      - name: avg_los_by_property
        description: "Average length of stay across all reservations for this property. Window function — AVG() OVER PARTITION BY property_code."
        data_tests:
          - not_null
      - name: running_revenue_by_guest
        description: "Cumulative revenue from this guest ordered by booking date. Window function — SUM() OVER PARTITION BY guest_profile_id ORDER BY booking_date."
        data_tests:
          - not_null
      - name: property_booking_rank
        description: "Rank of this reservation by total cost within the property. 1 = highest value booking. Window function — RANK() OVER PARTITION BY property_code."
        data_tests:
          - not_null
      - name: lead_time_quartile
        description: "Lead time bucket 1-4. Q1 = same week bookers, Q4 = 3+ months advance. Window function — NTILE(4) OVER ORDER BY lead_time_days."
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

  - name: int_booking_channel_enriched
    description: "Reservations enriched with rate code details from seed table and guest channel behaviour analytics. Tracks channel shifts from OTA to direct — key distribution strategy metric."
    meta:
      owner: sachin
      domain: hotel
    columns:
      - name: confirmation_number
        description: "Unique reservation identifier."
        data_tests:
          - not_null
          - unique
      - name: property_code
        description: "Property where reservation is held."
        data_tests:
          - not_null
      - name: guest_profile_id
        description: "Guest making the reservation."
        data_tests:
          - not_null
      - name: booking_date
        description: "Date reservation was made."
        data_tests:
          - not_null
      - name: booking_status
        description: "Current reservation status."
        data_tests:
          - not_null
      - name: rate_code
        description: "Opera rate code."
        data_tests:
          - not_null
      - name: rate_channel
        description: "Derived booking channel."
        data_tests:
          - not_null
      - name: rate_flexibility
        description: "Derived flexibility tier."
        data_tests:
          - not_null
      - name: includes_breakfast
        description: "True for RB rate codes."
        data_tests:
          - not_null
      - name: market_segment
        description: "Derived market segment."
        data_tests:
          - not_null
      - name: is_direct_booking
        description: "True when booking was made directly."
        data_tests:
          - not_null
      - name: rate_category
        description: "Rate category from seed table — STANDARD, OTA, LOYALTY, CORPORATE etc."
      - name: rate_description
        description: "Full rate code description from seed table."
      - name: first_booking_channel
        description: "Channel used for guest first ever booking. FIRST_VALUE() window function."
        data_tests:
          - not_null
      - name: guest_booking_count
        description: "Total bookings made by this guest. COUNT() window function."
        data_tests:
          - not_null
      - name: is_first_booking
        description: "True for guest first booking. ROW_NUMBER() = 1 window function."
        data_tests:
          - not_null
      - name: channel_shift
        description: "Guest channel behaviour — CONSISTENT, OTA_TO_DIRECT, DIRECT_TO_OTA, CHANNEL_CHANGE."
        data_tests:
          - not_null
          - accepted_values:
              values: ["CONSISTENT", "OTA_TO_DIRECT", "DIRECT_TO_OTA", "CHANNEL_CHANGE"]
