
models:
  - name: dim_property
    description: "Property dimension with SCD Type 2 history from snap_hotel_properties."
    columns:
      - name: property_key
        description: "Surrogate key — property_code + dbt_valid_from."
        data_tests:
          - unique
          - not_null
      - name: property_code
        description: "Natural key — not unique due to SCD2 versioning."
        data_tests:
          - not_null
      - name: tier
        description: "Brand tier at this version."
        data_tests:
          - not_null
          - accepted_values:
              values: ['LUXURY', 'PREMIUM', 'MIDSCALE', 'ECONOMY']
      - name: dbt_valid_from
        description: "Start date of this property version."
        data_tests:
          - not_null
      - name: is_current
        description: "True if this is the current active version."
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
  - name: fct_revpar_daily
    description: "Daily RevPAR fact table at property and date grain. One row per property per day."
    columns:
      - name: revpar_key
        description: "Surrogate key -- hash of property_code and stay_date."
        data_tests:
          - not_null
          - unique
      - name: property_key
        description: "Foreign key to dim_property (current record)."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_property')
              field: property_key
      - name: property_code
        description: "Natural key for the property."
        data_tests:
          - not_null
      - name: stay_date
        description: "The date for which KPIs are calculated."
        data_tests:
          - not_null
      - name: revpar_eur
        description: "Revenue Per Available Room in EUR."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              severity: warn
      - name: occupancy_rate
        description: "Rooms sold divided by rooms available."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND occupancy_rate <= 1"
              severity: warn
      - name: loaded_at
        description: "Timestamp when the record was loaded into the mart."
        data_tests:
          - not_null
  - name: fct_adr_daily
    description: "Daily ADR fact table at property and date grain. One row per property per day."
    columns:
      - name: adr_key
        description: "Surrogate key -- hash of property_code and stay_date."
        data_tests:
          - not_null
          - unique
      - name: property_key
        description: "Foreign key to dim_property (current record)."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_property')
              field: property_key
      - name: property_code
        description: "Natural key for the property."
        data_tests:
          - not_null
      - name: stay_date
        description: "The date for which ADR is calculated."
        data_tests:
          - not_null
      - name: avg_daily_rate_eur
        description: "Average Daily Rate in EUR. Room revenue divided by rooms sold."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              severity: warn
      - name: loaded_at
        description: "Timestamp when the record was loaded into the mart."
        data_tests:
          - not_null
