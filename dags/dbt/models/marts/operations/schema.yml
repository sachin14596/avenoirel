version: 2

models:
  - name: fct_bookings
    description: "One row per booking with stay metrics, lead time, and total cost in EUR."
    config:
      contract:
        enforced: true
    columns:
      - name: booking_key
        data_type: varchar
        description: "Surrogate key for the booking."
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: confirmation_number
        data_type: varchar
        description: "Natural key of the reservation."
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: property_key
        data_type: varchar
        description: "Foreign key to dim_property."
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: property_code
        data_type: varchar
        description: "Natural key of the property."
      - name: guest_profile_id
        data_type: varchar
        description: "Guest profile identifier."
      - name: booking_date
        data_type: date
        description: "Date the booking was made."
      - name: check_in_date
        data_type: date
        description: "Arrival date."
      - name: check_out_date
        data_type: date
        description: "Departure date."
      - name: rate_channel
        data_type: varchar
        description: "Channel attribute of the rate code used for the booking."
      - name: booking_status
        data_type: varchar
        description: "Reservation status."
        data_tests:
          - not_null
          - accepted_values:
              values: ['CONFIRMED', 'CHECKED_IN', 'CHECKED_OUT', 'CANCELLED', 'NO_SHOW']
      - name: length_of_stay_nights
        data_type: number(9,0)
        description: "Number of nights of the stay."
        data_tests:
          - not_null
      - name: lead_time_days
        data_type: number(9,0)
        description: "Days between booking date and check-in date."
        data_tests:
          - not_null
      - name: total_cost_eur
        data_type: float
        description: "Total cost of the booking in EUR."
      - name: is_direct_booking
        data_type: boolean
        description: "True if the booking was made directly, not through an intermediary."
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: loaded_at
        data_type: timestamp_ltz
        description: "Timestamp when the record was loaded into the mart."
  - name: fct_cancellations
    description: "One row per cancellation with reason, timing window, and revenue at risk."
    columns:
      - name: cancellation_key
        data_tests:
          - unique
          - not_null
      - name: confirmation_number
        data_tests:
          - unique
          - not_null
      - name: property_key
        data_tests:
          - not_null
      - name: cancellation_window
        data_tests:
          - not_null
          - accepted_values:
              values: ['SAME_DAY', 'SHORT', 'MEDIUM', 'ADVANCE', 'LAST_MINUTE']
      - name: reason_group
        data_tests:
          - not_null
          - accepted_values:
              values: ['GUEST_INITIATED', 'HOTEL_INITIATED', 'NO_SHOW', 'DUPLICATE', 'GROUP', 'SYSTEM']

  - name: fct_occupancy_daily
    description: "One row per property per date with room availability and occupancy rate."
    config:
      contract:
        enforced: true
    columns:
      - name: occupancy_key
        data_type: varchar
        description: "Surrogate key: hash of property_code and stay_date."
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: property_key
        data_type: varchar
        description: "Foreign key to dim_property (current record)."
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: property_code
        data_type: varchar
        description: "Natural key of the property."
      - name: stay_date
        data_type: date
        description: "The date for which occupancy is calculated."
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: total_rooms
        data_type: number(38,0)
        description: "Rooms of all room types in the availability calendar for this property and date."
      - name: ooo_rooms
        data_type: number(38,0)
        description: "Rooms out of order, not sellable."
      - name: rooms_available
        data_type: number(38,0)
        description: "Sellable rooms: total rooms minus out of order rooms."
      - name: rooms_sold
        data_type: number(18,0)
        description: "Sold rooms: CHECKED_IN, CHECKED_OUT and NO_SHOW stays. Cancelled bookings, test records and duplicates are excluded."
      - name: occupancy_rate
        data_type: number(26,4)
        description: "Rooms sold divided by rooms available. NULL when no rooms are available."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND occupancy_rate <= 1"
              config:
                store_failures: true
      - name: loaded_at
        data_type: timestamp_ltz
        description: "Timestamp when the record was loaded into the mart."

  - name: dim_guest
    description: "Guest dimension, one row per guest profile, built from stg_guests. Five columns carry personal info (PII) and are marked with meta pii true."
    config:
      contract:
        enforced: true
    meta:
      owner: sachin
      domain: operations
    columns:
      - name: guest_key
        data_type: varchar
        description: "Surrogate key: hash of guest_profile_id."
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: guest_profile_id
        data_type: varchar
        description: "Natural key. Opera-style guest profile identifier."
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: guest_title
        data_type: varchar
        description: "Salutation (Mr, Mrs, Ms, Dr, Prof). Nullable. Not masked: low sensitivity."
      - name: guest_first_name
        data_type: varchar
        description: "Guest first name. PII."
        meta:
          pii: true
        data_tests:
          - not_null
      - name: guest_last_name
        data_type: varchar
        description: "Guest last name. PII."
        meta:
          pii: true
        data_tests:
          - not_null
      - name: guest_email
        data_type: varchar
        description: "Guest email. PII. Nullable."
        meta:
          pii: true
      - name: guest_phone
        data_type: varchar
        description: "Guest phone number. PII. Nullable."
        meta:
          pii: true
      - name: guest_address
        data_type: varchar
        description: "Guest address. PII. Nullable."
        meta:
          pii: true
      - name: nationality_code
        data_type: varchar
        description: "ISO 3-letter nationality code. Nullable. Not masked: needed for nationality analysis."
      - name: is_avenir_member
        data_type: boolean
        description: "True when the guest is enrolled in AVENIR Rewards."
      - name: has_invalid_name
        data_type: boolean
        description: "Data quality flag: fake or joke name."
      - name: has_garbled_name
        data_type: boolean
        description: "Data quality flag: transliteration artifact in the name."
      - name: has_invalid_email
        data_type: boolean
        description: "Data quality flag: dummy email address."
      - name: has_missing_phone
        data_type: boolean
        description: "Data quality flag: phone number missing."
      - name: has_missing_address
        data_type: boolean
        description: "Data quality flag: address missing."
      - name: created_date
        data_type: date
        description: "Date the guest profile was created in the source system."
