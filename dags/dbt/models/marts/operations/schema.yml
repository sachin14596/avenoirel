version: 2

models:
  - name: fct_bookings
    description: "One row per booking with stay metrics, lead time, and total cost in EUR."
    columns:
      - name: booking_key
        data_tests:
          - unique
          - not_null
      - name: confirmation_number
        data_tests:
          - unique
          - not_null
      - name: property_key
        data_tests:
          - not_null
      - name: booking_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['CONFIRMED', 'CHECKED_IN', 'CHECKED_OUT', 'CANCELLED', 'NO_SHOW']
      - name: length_of_stay_nights
        data_tests:
          - not_null
      - name: lead_time_days
        data_tests:
          - not_null
      - name: is_direct_booking
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
  - name: fct_cancellations
    description: "One row per cancellation with reason, timing window, and revenue at risk."
    columns:
      - name: cancellation_key
        data_tests:
          - unique
          - not_null
      - name: confirmation_number
        data_tests:
          - unique
          - not_null
      - name: property_key
        data_tests:
          - not_null
      - name: cancellation_window
        data_tests:
          - not_null
          - accepted_values:
              values: ['SAME_DAY', 'SHORT', 'MEDIUM', 'ADVANCE', 'LAST_MINUTE']
      - name: reason_group
        data_tests:
          - not_null
          - accepted_values:
              values: ['GUEST_INITIATED', 'HOTEL_INITIATED', 'NO_SHOW', 'DUPLICATE', 'GROUP', 'SYSTEM']

  - name: fct_occupancy_daily
    description: "One row per property per date with room availability and occupancy rate."
    columns:
      - name: occupancy_key
        data_tests:
          - unique
          - not_null
      - name: property_key
        data_tests:
          - not_null
      - name: stay_date
        data_tests:
          - not_null
      - name: occupancy_rate
        data_tests:
          - not_null