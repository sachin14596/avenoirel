version: 2

models:
  - name: fct_bookings
    description: "One row per booking with stay metrics, lead time, and total cost in EUR."
    columns:
      - name: booking_key
        tests:
          - unique
          - not_null
      - name: confirmation_number
        tests:
          - unique
          - not_null
      - name: property_key
        tests:
          - not_null
      - name: booking_status
        tests:
          - not_null
          - accepted_values:
              values: ['CONFIRMED', 'CHECKED_IN', 'CHECKED_OUT', 'CANCELLED', 'NO_SHOW']
      - name: length_of_stay_nights
        tests:
          - not_null
      - name: lead_time_days
        tests:
          - not_null
      - name: is_direct_booking
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
  - name: fct_cancellations
    description: "One row per cancellation with reason, timing window, and revenue at risk."
    columns:
      - name: cancellation_key
        tests:
          - unique
          - not_null
      - name: confirmation_number
        tests:
          - unique
          - not_null
      - name: property_key
        tests:
          - not_null
      - name: cancellation_window
        tests:
          - not_null
          - accepted_values:
              values: ['SAME_DAY', 'SHORT', 'MEDIUM', 'ADVANCE', 'LAST_MINUTE']
      - name: reason_group
        tests:
          - not_null
          - accepted_values:
              values: ['GUEST_INITIATED', 'HOTEL_INITIATED', 'NO_SHOW', 'DUPLICATE', 'GROUP', 'SYSTEM']
