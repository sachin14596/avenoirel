version: 2

models:
  - name: fct_bookings
    description: "One row per booking with stay metrics, lead time, and total cost in EUR."
    columns:
      - name: booking_key
        tests:
          - unique
          - not_null
      - name: confirmation_number
        tests:
          - unique
          - not_null
      - name: property_key
        tests:
          - not_null
      - name: booking_status
        tests:
          - not_null
          - accepted_values:
              values: ['CONFIRMED', 'CHECKED_IN', 'CHECKED_OUT', 'CANCELLED', 'NO_SHOW']
      - name: length_of_stay_nights
        tests:
          - not_null
      - name: lead_time_days
        tests:
          - not_null
      - name: is_direct_booking
        tests:
          - not_null
          - accepted_values:
              values: [true, false]