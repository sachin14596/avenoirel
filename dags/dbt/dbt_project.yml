name: 'avenoirel'
version: '1.0.0'
profile: 'avenoirel'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  
seeds:
  avenoirel:
    +schema: staging
    +quote_columns: false

vars:
  env: "{{ env_var('DBT_ENV', 'dev') }}"

models:
  avenoirel:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      revenue:
        +materialized: table
      loyalty:
        +materialized: table
      operations:
        +materialized: table
      core:
        +materialized: table